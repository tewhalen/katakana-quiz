<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カタカナ Flashcards</title>
  <meta name="description" content="Flashcard drill for the 2000 most common katakana loanwords in Japanese news.">

  <!-- Open Graph -->
  <meta property="og:title" content="カタカナ Flashcards">
  <meta property="og:description" content="Flashcard drill for the 2000 most common katakana loanwords in Japanese news.">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="カタカナ Flashcards">
  <meta name="twitter:description" content="Flashcard drill for the 2000 most common katakana loanwords in Japanese news.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f12;
      color: #e8e8e8;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow: hidden;
    }

    header {
      font-size: 12px;
      letter-spacing: 0.25em;
      color: #444;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .card {
      background: #16161c;
      border: 1px solid #252530;
      border-radius: 20px;
      padding: 44px 40px 36px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      /* Stretch card to fill available viewport height */
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .progress-bar {
      height: 3px;
      background: #222230;
      border-radius: 2px;
      margin-bottom: 44px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #c0392b;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .katakana-word {
      font-size: 82px; /* fallback; overridden inline by fontSizeForLen() */
      letter-spacing: 6px;
      line-height: 1.15;
      /* Fill all available space between progress bar and input */
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      width: 100%;
    }

    #answer-input {
      width: 100%;
      font-size: 28px;
      padding: 14px 16px;
      background: #0f0f14;
      border: 2px solid #2a2a38;
      border-radius: 10px;
      color: #fff;
      text-align: center;
      outline: none;
      letter-spacing: 3px;
      transition: border-color 0.2s, background 0.2s;
      display: block;
    }
    #answer-input:focus { border-color: #4a4a68; }
    #answer-input.correct   { border-color: #2e7d4f; background: #0d1a12; }
    #answer-input.incorrect { border-color: #8b2020; background: #1a0d0d; }

    .ime-hint {
      font-size: 11px;
      color: #383848;
      margin-top: 8px;
      min-height: 16px;
    }
    .ime-hint em { font-style: normal; color: #555; }

    .feedback {
      margin-top: 28px;
      min-height: 96px;
    }

    .verdict {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    .verdict.correct   { color: #4caf70; }
    .verdict.incorrect { color: #e05050; }

    .correction {
      font-size: 26px;
      letter-spacing: 4px;
      color: #ccc;
      margin-bottom: 10px;
    }

    .meaning { font-size: 19px; color: #aaa; }
    .meaning a { color: #556; font-size: 14px; text-decoration: none; border: 1px solid #2a2a3a; border-radius: 6px; padding: 3px 10px; }
    .meaning a:hover { background: #1e1e2a; color: #aaa; }
    .romaji  { font-size: 14px; color: #555; margin-top: 4px; }

    .next-btn {
      margin-top: 28px;
      padding: 12px 44px;
      background: #1e1e2a;
      color: #bbb;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.04em;
    }
    .next-btn:hover, .next-btn:focus { background: #27273a; color: #eee; outline: none; }
    .next-btn:disabled { opacity: 0.3; cursor: default; }

    .stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 28px;
      font-size: 11px;
      color: #3a3a50;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .stat-val {
      display: block;
      font-size: 17px;
      color: #777;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .done { text-align: center; padding: 8px 0; }
    .done h2 { font-size: 28px; margin-bottom: 14px; }
    .done p  { font-size: 14px; color: #555; margin-bottom: 6px; line-height: 1.7; }

    /* Hide non-essential elements when the mobile keyboard pushes the viewport down */
    body.keyboard-open .stats,
    body.keyboard-open .ime-hint { display: none; }
  </style>
  <script src="https://unpkg.com/wanakana@5/wanakana.min.js"></script>
</head>
<body>
  <header>カタカナ Flashcards</header>
  <div class="card" id="app"></div>

  <script>
  const WORDS = [
{{WORDS}}
  ];

  // ── Probability-based SRS (adapted from jconj by Bailey Snyder) ─
  // Session-scoped: no persistence. Incorrect cards surface almost
  // immediately; correct cards are deprioritised. All words stay in
  // the pool forever — the session is open-ended.

  class Card {
    constructor(word) {
      this.word = word;   // [katakana, romaji, meaning]
      this.probability = 0;
      this.wasRecentlyIncorrect = false;
    }
  }

  class RecentlySeen {
    constructor(card, wasCorrect) {
      this.card = card;
      this.wasCorrect = wasCorrect;
    }
  }

  function normalizeProbabilities(pool) {
    let total = 0;
    for (const c of pool) total += c.probability;
    for (const c of pool) c.probability /= total;
  }

  function findMinProb(pool) {
    let min = 2;
    for (const c of pool)
      if (c.probability !== 0 && c.probability < min) min = c.probability;
    return min;
  }

  function equalizeProbabilities(pool) {
    for (const c of pool) c.probability = 1;
    normalizeProbabilities(pool);
  }

  function updateProbabilities(pool, recentQueue, currentCard, wasCorrect) {
    const roundsToWait = 2;
    if (pool.length < roundsToWait + 1) {
      for (const c of pool) c.probability = 1;
      currentCard.probability = 0;
      normalizeProbabilities(pool);
      return;
    }
    if (recentQueue.length >= roundsToWait) {
      const dequeued = recentQueue.shift();
      const minProb  = findMinProb(pool);
      let newProb;
      if (dequeued.wasCorrect && !dequeued.card.wasRecentlyIncorrect) {
        newProb = minProb * 0.5;
      } else if (dequeued.wasCorrect && dequeued.card.wasRecentlyIncorrect) {
        newProb = minProb * 0.85;
        dequeued.card.wasRecentlyIncorrect = false;
      } else {
        newProb = 10; // nearly guaranteed to appear next
      }
      dequeued.card.probability = newProb;
    }
    if (!wasCorrect) currentCard.wasRecentlyIncorrect = true;
    recentQueue.push(new RecentlySeen(currentCard, wasCorrect));
    currentCard.probability = 0;
    normalizeProbabilities(pool);
  }

  function pickCard(pool) {
    let r = Math.random();
    for (const c of pool) {
      if (r < c.probability) return c;
      r -= c.probability;
    }
    return pool[0];
  }

  // ── App state ─────────────────────────────────────────────────
  let cardPool, recentQueue, sessCorrect, sessTotal, streak, keyBinding;

  function clearKeyBinding() {
    if (keyBinding) {
      keyBinding.el.removeEventListener(keyBinding.event, keyBinding.fn);
      keyBinding = null;
    }
  }

  function startSession() {
    cardPool    = WORDS.map(w => new Card(w));
    recentQueue = [];
    sessCorrect = 0;
    sessTotal   = 0;
    streak      = 0;
    keyBinding  = null;
    equalizeProbabilities(cardPool);

    // ?word=タクシー — pin a specific card first (for testing)
    const pin = new URLSearchParams(location.search).get('word');
    const pinned = pin ? cardPool.find(c => c.word[0] === pin) : null;
    renderQuestion(pinned || pickCard(cardPool));
  }

  function advance() {
    clearKeyBinding();
    renderQuestion(pickCard(cardPool));
  }

  // ── Accepted alternate spellings ─────────────────────────────
  // Keys are the canonical katakana (matching WORDS). Values are arrays of
  // additional spellings that should be marked correct.
  const ALIASES = {
    "ウイルス": ["ウィルス"],
    "ウイスキー": ["ウィスキー"],
  };

  function isCorrect(typed, canonical) {
    if (typed === canonical) return true;
    const alts = ALIASES[canonical];
    return alts ? alts.includes(typed) : false;
  }

  function submit(typed, card) {
    clearKeyBinding();
    const correct = isCorrect(typed, card.word[0]);
    sessTotal++;
    if (correct) { sessCorrect++; streak++; } else { streak = 0; }
    updateProbabilities(cardPool, recentQueue, card, correct);
    renderFeedback(typed, correct, card);
  }

  // ── Render ────────────────────────────────────────────────────
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function progressPct() {
    // Fill bar with accuracy so it gives useful visual feedback
    return sessTotal > 0 ? Math.round(sessCorrect / sessTotal * 100) : 0;
  }

  function statsHTML() {
    const acc = sessTotal > 0 ? Math.round(sessCorrect / sessTotal * 100) + '%' : '—';
    return `
      <div class="stats">
        <div><span class="stat-val">${streak}</span>streak</div>
        <div><span class="stat-val">${sessCorrect}/${sessTotal}</span>correct</div>
        <div><span class="stat-val">${acc}</span>accuracy</div>
      </div>`;
  }

  function fontSizeForLen(len) {
    const mobile = window.matchMedia('(max-width: 480px)').matches;
    if (mobile) {
      if (len <= 5) return '52px';
      if (len <= 7) return '38px';
      if (len <= 9) return '28px';
      return '22px';
    }
    if (len <= 5) return '82px';
    if (len <= 7) return '60px';
    if (len <= 9) return '44px';
    return '36px';
  }

  function renderQuestion(card) {
    document.getElementById('app').innerHTML = `
      <div class="progress-bar">
        <div class="progress-fill" style="width:${progressPct()}%"></div>
      </div>
      <div class="katakana-word" style="font-size:${fontSizeForLen(card.word[0].length)}">${esc(card.word[0])}</div>
      <div class="feedback"></div>
      <input id="answer-input" type="text"
             inputmode="text"
             autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false"
             placeholder="カタカナ…" />
      <p class="ime-hint">Type romaji (e.g. <em>ko-hi-</em>) or switch IME to カタカナ</p>
      <button class="next-btn" id="check-btn" disabled>Check ✓</button>
      ${statsHTML()}
    `;
    const inp = document.getElementById('answer-input');
    const btn = document.getElementById('check-btn');

    // Convert romaji → katakana as the user types
    wanakana.bind(inp, { IMEMode: 'toKatakana' });

    function trySubmit() {
      const val = inp.value.trim();
      if (val) submit(val, card);
    }

    inp.addEventListener('input', () => {
      btn.disabled = inp.value.trim().length === 0;
    });

    btn.addEventListener('click', trySubmit);

    inp.focus();
    const fn = e => { if (e.key === 'Enter' && inp.value.trim()) trySubmit(); };
    inp.addEventListener('keyup', fn);
    keyBinding = { el: inp, event: 'keyup', fn };
  }

  function renderFeedback(typed, correct, card) {
    document.getElementById('app').innerHTML = `
      <div class="progress-bar">
        <div class="progress-fill" style="width:${progressPct()}%"></div>
      </div>
      <div class="katakana-word" style="font-size:${fontSizeForLen(card.word[0].length)}">${esc(card.word[0])}</div>
      <div class="feedback">
        <div class="verdict ${correct ? 'correct' : 'incorrect'}">
          ${correct ? '✓ Correct' : '✗ Incorrect'}
        </div>
        ${!correct ? `<div class="correction">${esc(card.word[0])}</div>` : ''}
        <div class="meaning">${card.word[2] ? esc(card.word[2]) : `<a href="https://www.google.com/search?q=${encodeURIComponent(card.word[0])}" target="_blank" rel="noopener">Search ↗</a>`}</div>
        <div class="romaji">${esc(card.word[1])}</div>
      </div>
      <input id="answer-input" type="text"
             class="${correct ? 'correct' : 'incorrect'}"
             readonly />
      <p class="ime-hint">&nbsp;</p>
      <button class="next-btn" id="next-btn">Next →</button>
      ${statsHTML()}
    `;
    // Set value via JS property to avoid any injection risk
    document.getElementById('answer-input').value = typed;
    const fn = e => { if (e.key === 'Enter') advance(); };
    document.addEventListener('keydown', fn);
    keyBinding = { el: document, event: 'keydown', fn };
    const btn = document.getElementById('next-btn');
    // Delay click listener to avoid iOS ghost-click: the same touch that
    // triggered "Check" can fire a synthetic click on the newly rendered
    // "Next" button if it appears under the finger.
    setTimeout(() => btn.addEventListener('click', advance), 350);
  }

  // ── Mobile keyboard: resize body to visualViewport so nothing scrolls off ──
  function applyViewportHeight() {
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.body.style.height = vh + 'px';
    document.body.style.minHeight = vh + 'px';
    const keyboardOpen = vh < window.innerHeight * 0.8;
    document.body.classList.toggle('keyboard-open', keyboardOpen);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', applyViewportHeight);
  }
  applyViewportHeight();

  // ── Boot ──────────────────────────────────────────────────────
  startSession();
  </script>
</body>
</html>
